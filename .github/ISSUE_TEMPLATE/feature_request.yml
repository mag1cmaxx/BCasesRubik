name: Идея / Feature request
description: Предложить улучшение / Suggest an improvement
labels: [ enhancement ]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что добавить / What to add
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем это нужно / Why it is useful
